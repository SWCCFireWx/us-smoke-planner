name: Update data

on:
  schedule:
    # Every 3 hours (GitHub schedules are in UTC). Each run pulls the latest
    # NBM run (CONUS, Alaska, Hawaii, Puerto Rico), HRRR smoke, NWS fire alerts,
    # AirNow, EPA areas, ERC/BI, perimeters, GACCs and PSAs, then republishes.
    - cron: "37 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "fetch_data.py", ".github/workflows/update-data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install numpy scipy pygrib timezonefinder

      - name: Build site and data (NBM, perimeters, GACC and PSA boundaries)
        run: |
          mkdir -p _site
          cp index.html _site/
          python fetch_data.py --out _site/data

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
